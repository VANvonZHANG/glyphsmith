# pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gsrender"
version = "0.1.0"
description = "AI-agent-native GSF glyph renderer (legacy-kurgm faithful port + pen backends)"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = ["gsftool", "numpy", "pillow"]

[project.scripts]
gsr = "gsrender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
